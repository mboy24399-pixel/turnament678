name: Migrate Firebase config to Vercel env

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace hardcoded Firebase config
        shell: python
        run: |
          from pathlib import Path
          import re

          replacement = '''const firebaseConfigResponse = await fetch("/api/firebase-config", { cache: "no-store" });
          if (!firebaseConfigResponse.ok) {
              throw new Error(`Firebase config endpoint failed: ${firebaseConfigResponse.status}`);
          }
          const firebaseConfig = await firebaseConfigResponse.json();'''

          for name in ("index.html", "admin.html"):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              pattern = r'const firebaseConfig = \{[\s\S]*?\n\};'
              new_text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"Could not find Firebase config block in {name}")
              path.write_text(new_text, encoding="utf-8")

      - name: Add Firebase config endpoint
        shell: bash
        run: |
          mkdir -p api
          cat > api/firebase-config.js <<'EOF'
          export default function handler(req, res) {
            const projectId = process.env.NEXT_PUBLIC_FIREBASE_PROJECT_ID || '';
            const databaseURL = process.env.NEXT_PUBLIC_FIREBASE_DATABASE_URL ||
              (projectId ? `https://${projectId}-default-rtdb.asia-southeast1.firebasedatabase.app` : '');

            const config = {
              apiKey: process.env.NEXT_PUBLIC_FIREBASE_API_KEY || '',
              authDomain: process.env.NEXT_PUBLIC_FIREBASE_H_DOMAIN || '',
              databaseURL,
              projectId,
              storageBucket: process.env.NEXT_PUBLIC_FIREBASE_BUCKET || '',
              messagingSenderId: process.env.NEXT_PUBLIC_FIREBASE_SENDER_ID || '',
              appId: process.env.NEXT_PUBLIC_FIREBASE_APP_ID || process.env.NEXT_PUBLIC_FIREBASE_OBJECT_ID || ''
            };

            const missing = Object.entries(config)
              .filter(([key, value]) => !value && key !== 'databaseURL')
              .map(([key]) => key);

            if (missing.length) {
              return res.status(500).json({ error: 'Firebase client configuration is incomplete', missing });
            }

            res.setHeader('Cache-Control', 'no-store');
            return res.status(200).json(config);
          }
          EOF

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/migrate-firebase-config.yml
          git add index.html admin.html api/firebase-config.js .github/workflows/migrate-firebase-config.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Connect Firebase through Vercel environment variables"
          git push
