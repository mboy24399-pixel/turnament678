<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podmen X — Admin Control</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#070b13;--panel:#101827;--panel2:#151f31;--line:#26344c;--text:#f5f7fb;--muted:#9aa8bd;--brand:#f6c945;--blue:#5b8cff;--green:#2dd4a0;--red:#ff647a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}header{position:sticky;top:0;z-index:10;background:rgba(7,11,19,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.head{max-width:1200px;margin:auto;padding:14px 20px;display:flex;gap:15px;align-items:center}.brand{font-weight:800}.brand b{color:var(--brand)}.head .muted{margin-left:auto}.shell{max-width:1200px;margin:auto;padding:24px 20px 50px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px}.stat strong{display:block;font-size:27px}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;margin:22px 0;overflow:auto}.tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:10px 13px;border-radius:10px}.tab.active{background:var(--brand);color:#17130a;border-color:var(--brand);font-weight:800}.two{display:grid;grid-template-columns:1.1fr .9fr;gap:15px}.form{display:grid;gap:10px}.form input,.form select,.form textarea{width:100%;background:#090f1a;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px;outline:none}.form textarea{min-height:85px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 13px;border-radius:10px}.btn.primary{background:var(--brand);color:#17130a;border-color:transparent;font-weight:800}.btn.blue{background:var(--blue);border-color:transparent;font-weight:700}.btn.danger{background:rgba(255,100,122,.1);color:#ff9aaa}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.list{display:grid;gap:8px}.item{border:1px solid var(--line);background:#0d1422;border-radius:12px;padding:12px}.badge{font-size:11px;border-radius:99px;padding:5px 8px;background:#202b40;color:var(--muted)}.badge.live{color:#06130e;background:var(--green)}.badge.open{color:#17130a;background:var(--brand)}.badge.done{background:#30394a;color:#fff}.toast{position:fixed;right:18px;bottom:18px;background:#121c2c;border:1px solid var(--line);padding:12px 15px;border-radius:11px;display:none;z-index:50}.toast.show{display:block}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(420px,100%)}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.shell{padding:16px 12px}}</style></head><body><div id="login" class="login"><div class="card"><div class="brand">PODMEN <b>X</b> ADMIN</div><h1>Control Center</h1><p class="muted">Admin access is verified by Firebase and the <code>admins/{uid}</code> database flag.</p><div class="form"><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button class="btn primary" id="loginBtn">Sign in</button></div><p class="muted" id="loginMsg"></p></div></div><div id="app" style="display:none"><header><div class="head"><div class="brand">PODMEN <b>X</b> CONTROL</div><span class="muted" id="adminUid"></span><button class="btn" id="logout">Sign out</button></div></header><main class="shell"><div class="grid"><div class="stat"><strong id="sT">0</strong><span class="muted">Tournaments</span></div><div class="stat"><strong id="sL">0</strong><span class="muted">Live</span></div><div class="stat"><strong id="sR">0</strong><span class="muted">Registrations</span></div><div class="stat"><strong id="sM">0</strong><span class="muted">Matches</span></div></div><div class="tabs"><button class="tab active" data-tab="tournaments">Tournaments</button><button class="tab" data-tab="matches">Matches</button><button class="tab" data-tab="announcements">Announcements</button></div><section id="tab-tournaments"><div class="two"><div class="card"><div class="row"><h2>Create tournament</h2><span class="badge open">ADMIN</span></div><div class="form"><input id="name" placeholder="Tournament name"><div class="row"><input id="game" placeholder="Game" value="Free Fire"><input id="mode" placeholder="Mode" value="Solo"></div><div class="row"><select id="format"><option>Single Elimination</option><option>Double Elimination</option><option>Round Robin</option><option>Battle Royale</option></select><input id="capacity" type="number" min="2" value="32" placeholder="Capacity"></div><div class="row"><input id="prize" placeholder="Prize"><input id="entry" placeholder="Entry fee" value="Free"></div><div class="row"><label class="muted">Start <input id="start" type="datetime-local"></label><label class="muted">End <input id="end" type="datetime-local"></label></div><textarea id="description" placeholder="Rules, eligibility, check-in and prize details"></textarea><button class="btn primary" id="createBtn">Publish tournament</button></div></div><div class="card"><h2>Live tournaments</h2><div id="tournamentList" class="list"></div></div></div></section><section id="tab-matches" style="display:none"><div class="two"><div class="card"><h2>Record match result</h2><div class="form"><select id="matchTournament"></select><input id="matchId" placeholder="Match ID"><input id="p1" placeholder="Player 1 UID"><input id="p2" placeholder="Player 2 UID"><input id="score1" type="number" placeholder="Player 1 score"><input id="score2" type="number" placeholder="Player 2 score"><input id="round" placeholder="Round e.g. Quarterfinal"><button class="btn primary" id="saveMatch">Save result</button></div></div><div class="card"><h2>Recent matches</h2><div id="matchList" class="list"></div></div></div></section><section id="tab-announcements" style="display:none"><div class="card"><h2>Publish announcement</h2><div class="form"><input id="aTitle" placeholder="Title"><textarea id="aBody" placeholder="Message"></textarea><button class="btn primary" id="publishAnnouncement">Publish</button></div><div style="margin-top:18px" id="annList" class="list"></div></div></section></main></div><div id="toast" class="toast"></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";import{getDatabase,ref,get,set,update,onValue,serverTimestamp,push}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";const $=id=>document.getElementById(id),toast=m=>{$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2800)},esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const state={db:null,auth:null,user:null,tournaments:[],matches:[]};function st(t){const n=Date.now(),s=String(t.status||'');if(s==='completed')return'completed';if(s==='live')return'live';const a=new Date(t.startAt||0).getTime(),b=new Date(t.endAt||0).getTime();if(a&&n<a)return'open';if(a&&b&&n<=b)return'live';return s||'open'}async function boot(){try{const r=await fetch('/api/firebase-config',{cache:'no-store'});if(!r.ok)throw Error('Firebase config unavailable');const cfg=await r.json(),app=initializeApp(cfg);state.auth=getAuth(app);state.db=getDatabase(app);onAuthStateChanged(state.auth,async u=>{state.user=u;if(!u){$('login').style.display='grid';$('app').style.display='none';return}const a=await get(ref(state.db,`admins/${u.uid}`));if(a.val()!==true){await signOut(state.auth);$('loginMsg').textContent='This account is not an administrator.';return}$('login').style.display='none';$('app').style.display='block';$('adminUid').textContent=u.uid;subscribe()})}catch(e){console.error(e);$('loginMsg').textContent='Firebase setup is unavailable.'}}$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(state.auth,$('email').value.trim(),$('password').value);$('loginMsg').textContent=''}catch(e){$('loginMsg').textContent=e.message.replace('Firebase: ','')}};$('logout').onclick=()=>signOut(state.auth);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('main section').forEach(x=>x.style.display='none');$('tab-'+b.dataset.tab).style.display='block'});function subscribe(){onValue(ref(state.db,'tournaments'),s=>{const v=s.val()||{};state.tournaments=Object.entries(v).map(([id,t])=>({...t,id}));renderT();renderStats()});onValue(ref(state.db,'matches'),s=>{const v=s.val()||{};state.matches=Object.entries(v).map(([id,m])=>({...m,id}));renderM();renderStats()});onValue(ref(state.db,'announcements'),s=>{const v=s.val()||{};$('annList').innerHTML=Object.entries(v).reverse().slice(0,30).map(([id,a])=>`<div class="item"><strong>${esc(a.title)}</strong><div class="muted">${esc(a.body)}</div></div>`).join('')})}function renderStats(){let r=0;state.tournaments.forEach(t=>r+=Object.keys(t.registrations||{}).length);$('sT').textContent=state.tournaments.length;$('sL').textContent=state.tournaments.filter(t=>st(t)==='live').length;$('sR').textContent=r;$('sM').textContent=state.matches.length}function renderT(){$('tournamentList').innerHTML=state.tournaments.slice().reverse().map(t=>`<div class="item"><div class="row"><strong>${esc(t.name)}</strong><span class="badge ${st(t)==='live'?'live':st(t)==='completed'?'done':'open'}">${esc(st(t))}</span></div><div class="muted">${esc(t.game)} • ${esc(t.format)} • ${Object.keys(t.registrations||{}).length}/${t.capacity||'∞'} players</div><div style="margin-top:8px" class="row"><span>${esc(t.id)}</span><button class="btn danger" onclick="closeTournament('${t.id}')">Close</button></div></div>`).join('')||'<div class="muted">No tournaments yet.</div>';$('matchTournament').innerHTML=state.tournaments.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}function renderM(){$('matchList').innerHTML=state.matches.slice().reverse().slice(0,40).map(m=>`<div class="item"><div class="row"><strong>${esc(m.tournamentName||'Match')}</strong><span class="badge">${esc(m.status||'completed')}</span></div><div class="muted">${esc(m.round||'Match')} • ${esc(m.player1||'')} ${esc(m.score1??0)} — ${esc(m.score2??0)} ${esc(m.player2||'')}</div></div>`).join('')||'<div class="muted">No matches.</div>'}$('createBtn').onclick=async()=>{const name=$('name').value.trim();if(!name)return toast('Tournament name is required');const id=push(ref(state.db,'tournaments')).key,t={name,game:$('game').value.trim()||'Esports',mode:$('mode').value.trim()||'Solo',format:$('format').value,capacity:Number($('capacity').value||32),prize:$('prize').value.trim()||'—',entryFee:$('entry').value.trim()||'Free',startAt:$('start').value?new Date($('start').value).toISOString():new Date(Date.now()+86400000).toISOString(),endAt:$('end').value?new Date($('end').value).toISOString():new Date(Date.now()+9000000).toISOString(),registrationDeadline:$('start').value?new Date($('start').value).toISOString():new Date(Date.now()+86400000).toISOString(),description:$('description').value.trim(),status:'open',createdAt:serverTimestamp(),createdBy:state.user.uid,registrations:{}};try{await set(ref(state.db,`tournaments/${id}`),t);toast('Tournament published');['name','prize','description'].forEach(x=>$(x).value='')}catch(e){console.error(e);toast('Publish failed')}};window.closeTournament=async id=>{if(confirm('Close this tournament?'))try{await update(ref(state.db,`tournaments/${id}`),{status:'completed',closedAt:serverTimestamp(),closedBy:state.user.uid});toast('Tournament closed')}catch{toast('Could not close tournament')}};$('saveMatch').onclick=async()=>{const tid=$('matchTournament').value;if(!tid)return toast('Select a tournament');const t=state.tournaments.find(x=>x.id===tid),id=$('matchId').value.trim()||push(ref(state.db,'matches')).key,a=Number($('score1').value||0),b=Number($('score2').value||0),winner=a===b?'draw':a>b?$('p1').value.trim():$('p2').value.trim(),m={id,tournamentId:tid,tournamentName:t?.name||'',player1:$('p1').value.trim(),player2:$('p2').value.trim(),score1:a,score2:b,round:$('round').value.trim()||'Match',winner,status:'completed',updatedAt:serverTimestamp(),updatedBy:state.user.uid};try{await set(ref(state.db,`matches/${id}`),m);if(m.player1)await set(ref(state.db,`matchesByUser/${m.player1}/${id}`),m);if(m.player2)await set(ref(state.db,`matchesByUser/${m.player2}/${id}`),m);toast('Match result saved')}catch(e){console.error(e);toast('Could not save result')}};$('publishAnnouncement').onclick=async()=>{const title=$('aTitle').value.trim(),body=$('aBody').value.trim();if(!title||!body)return toast('Title and message are required');try{await push(ref(state.db,'announcements'),{title,body,createdAt:serverTimestamp(),createdBy:state.user.uid});$('aTitle').value='';$('aBody').value='';toast('Announcement published')}catch{toast('Could not publish announcement')}};boot();</script></body></html>
